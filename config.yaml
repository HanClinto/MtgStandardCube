# MTG Standard Cube Builder — Configuration

cube_size: 540

# Slots per color/category. Must sum to cube_size (or will be scaled).
# Multicolor cards are distributed here; lands are utility lands only.
color_slots:
  white: 90
  blue: 90
  black: 90
  red: 90
  green: 90
  multicolor: 60
  artifact: 18
  land: 12

ranking:
  # Extra weight multiplier per additional archetype a card appears in.
  # e.g. 0.2 → a card in 3 archetypes scores 1.4x a card in 1 archetype.
  cross_archetype_weight: 0.2
  # Ignore cards appearing in fewer than this many archetypes (across all sources).
  min_archetype_appearances: 1
  # How many copies in a deck count as "full playsets" for normalization.
  playset_size: 4

data_sources:
  mtgo:
    enabled: true
    weight: 1.0           # base multiplier; individual decks also get placement × tier weights
    cache_ttl_hours: 24
    max_events: 20        # how many recent Standard events to pull
    mtgo_only: true       # only pull events labeled as MTGO (skip paper-only events)
  moxfield:
    enabled: true
    weight: 0.6           # lower than MTGO since it's not tournament-filtered
    cache_ttl_hours: 24
    # Moxfield search params
    page_size: 64
    max_pages: 5
    sort_type: views      # views | likes | updated
    min_cards: 58         # skip obviously incomplete decks (checks total quantity)
